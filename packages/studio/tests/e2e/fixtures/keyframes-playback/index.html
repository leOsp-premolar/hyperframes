<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=640, height=360" />
    <script src="assets/gsap.min.js"></script>
    <script src="assets/MotionPathPlugin.min.js"></script>
    <style>
      html,
      body {
        margin: 0;
        width: 640px;
        height: 360px;
        overflow: hidden;
        background: #000;
      }
      #box {
        position: absolute;
        left: 40px;
        top: 140px;
        width: 80px;
        height: 80px;
        background: #f00;
      }
    </style>
  </head>
  <body>
    <!-- One red box, not yet animated; the keyframes-playback gate keys its position and writes
         assets/gsap.min.js and MotionPathPlugin.min.js from the workspace, since the preview cannot reach a CDN. -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="4"
      data-width="640"
      data-height="360"
      data-fps="30"
    >
      <div id="box" class="clip" data-start="0" data-duration="4" data-track-index="0"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
