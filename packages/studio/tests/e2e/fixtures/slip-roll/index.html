<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=640, height=360" />
    <style>
      html,
      body {
        margin: 0;
        width: 640px;
        height: 360px;
        overflow: hidden;
        background: #000;
      }
    </style>
  </head>
  <body>
    <!-- Two cuts of one 8s source, touching at 2s; the slip-roll gate writes assets/source.mp4. -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="4"
      data-width="640"
      data-height="360"
      data-no-timeline
    >
      <video
        id="a"
        class="clip"
        src="assets/source.mp4"
        data-start="0"
        data-duration="2"
        data-media-start="1"
        data-track-index="0"
        muted
        style="position: absolute; inset: 0; width: 640px; height: 360px"
      ></video>
      <video
        id="b"
        class="clip"
        src="assets/source.mp4"
        data-start="2"
        data-duration="2"
        data-media-start="4"
        data-track-index="0"
        muted
        style="position: absolute; inset: 0; width: 640px; height: 360px"
      ></video>
    </div>
  </body>
</html>
